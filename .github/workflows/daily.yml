name: Youtube Short

on:
  schedule:
    - cron: "0 0 * * 6"   # 00:00 UTC = 07:00 WIB
  workflow_dispatch:
    inputs:
      topik:
        description: "Topik khusus (kosongkan = otomatis)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  buat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang FFmpeg dan font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Buat video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_ID: ${{ vars.VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NICHE: ${{ vars.NICHE }}
          TOPIC: ${{ github.event.inputs.topik }}
        run: python generate.py

      - name: Simpan hasil (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: video-hari-ini
          path: |
            output/video.mp4
            output/caption.txt
          retention-days: 7

      - name: Simpan riwayat topik
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update riwayat topik" && git push)
